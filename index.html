<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blame it on the Question Cards</title>
  <meta name="description" content="Swipeable question cards for getting to know someone.">
  <!-- Browser toolbar colour on phones; js/theme.js updates it per theme -->
  <meta name="theme-color" content="#f7f5f0">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body data-theme="neutral">
  <!-- One background layer per theme; css/styles.css fades between them -->
  <div class="theme-backdrop" data-theme="neutral" aria-hidden="true"></div>
  <div class="theme-backdrop" data-theme="icebreaker" aria-hidden="true"></div>
  <div class="theme-backdrop" data-theme="dating" aria-hidden="true"></div>

  <main id="app" class="app">
    <!-- Start screen: pick a section -->
    <section id="start-screen" class="screen start-screen" aria-labelledby="app-title" hidden>
      <div class="start-screen__intro">
        <h1 id="app-title" class="start-screen__title">Blame it on the Question Cards</h1>
        <p class="start-screen__subtitle">Question Cards to get to know each other, so you can blame the cards for questions you're too shy to ask.</p>
      </div>
      <div class="section-choices">
        <button class="section-button" type="button" data-section="icebreaker" data-theme="icebreaker">
          <span class="section-button__name">Icebreaker</span>
          <span class="section-button__hint">First dates and new connections</span>
        </button>
        <button class="section-button" type="button" data-section="dating" data-theme="dating">
          <span class="section-button__name">Dating</span>
          <span class="section-button__hint">Couples a few months in</span>
        </button>
      </div>
      <button id="reset-button" class="text-button" type="button">Reset seen cards</button>
    </section>

    <!-- Card screen: the card stack and its controls -->
    <section id="card-screen" class="screen card-screen" hidden>
      <header class="app-header">
        <button id="home-button" class="toggle-button" type="button">&larr; Home</button>
        <h2 id="section-title" class="app-header__title"></h2>
        <button id="sound-toggle" class="toggle-button" type="button" aria-pressed="false">Sound off</button>
      </header>

      <!-- Dating only: the 18+ switch. Turning it on asks both people to confirm their age. -->
      <div id="adult-setting" class="setting-row" hidden>
        <label class="switch">
          <input id="adult-toggle" class="switch__input" type="checkbox" role="switch">
          <span class="switch__track" aria-hidden="true"></span>
          <span class="switch__label">Include 18+ questions</span>
        </label>
      </div>

      <!-- js/cards.js fills this with up to three cards -->
      <div class="card-area">
        <div id="card-stack" class="card-stack" aria-live="polite"></div>
      </div>

      <!-- Level: changes take effect on the next card -->
      <div class="level-controls">
        <button id="shallower-button" class="control-button control-button--small" type="button">Go Shallower</button>
        <div class="level-indicator" id="level-indicator" role="img">
          <span class="level-indicator__dots" aria-hidden="true">
            <span class="level-dot" data-level="1"></span>
            <span class="level-dot" data-level="2"></span>
            <span class="level-dot" data-level="3"></span>
          </span>
          <span id="level-name" class="level-indicator__name" aria-hidden="true"></span>
        </div>
        <button id="deeper-button" class="control-button control-button--small" type="button">Go Deeper</button>
      </div>

      <!-- Back and Next: same as the arrow keys -->
      <nav class="card-controls" aria-label="Card navigation">
        <button id="back-button" class="control-button" type="button">&larr; Back</button>
        <button id="next-button" class="control-button control-button--primary" type="button">Next &rarr;</button>
      </nav>
    </section>

    <!-- Confirmation dialog used by js/dialog.js (18+ check and Reset) -->
    <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-dialog-message">
      <form method="dialog" class="confirm-dialog__form">
        <p id="confirm-dialog-message" class="confirm-dialog__message"></p>
        <div class="confirm-dialog__buttons">
          <button id="confirm-dialog-cancel" class="control-button" type="submit" value="cancel">Cancel</button>
          <button id="confirm-dialog-confirm" class="control-button control-button--primary" type="submit" value="confirm">Confirm</button>
        </div>
      </form>
    </dialog>

    <!-- Plain-language error message, hidden unless something fails to load -->
    <p id="error-message" class="error-message" role="alert" hidden></p>
  </main>
</body>
</html>
