<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Question Cards</title>
  <meta name="description" content="Swipeable question cards for getting to know someone.">
  <!-- Browser toolbar colour on phones. Left empty here so every colour lives in
       the CSS theme tokens; js/theme.js fills it in from the tokens on load. -->
  <meta name="theme-color" content="">
  <!-- Release version: the "?v=" tag on the stylesheet and every script.
       GitHub Pages lets browsers keep files for up to 10 minutes; a new tag
       makes them fetch fresh copies straight away. When you release changes,
       replace every "v=2026-11-26.13" on this page with a new value (the date). -->
  <link rel="stylesheet" href="css/styles.css?v=2026-11-26.13">
  <!-- The import map gives each JavaScript module the same version tag, so the
       modules' own imports (e.g. "./config.js") also load fresh copies.
       Every file in js/ must be listed here. -->
  <script type="importmap">
    {
      "imports": {
        "./js/app.js": "./js/app.js?v=2026-11-26.13",
        "./js/card-image.js": "./js/card-image.js?v=2026-11-26.13",
        "./js/cards.js": "./js/cards.js?v=2026-11-26.13",
        "./js/config.js": "./js/config.js?v=2026-11-26.13",
        "./js/debug.js": "./js/debug.js?v=2026-11-26.13",
        "./js/dialog.js": "./js/dialog.js?v=2026-11-26.13",
        "./js/feedback.js": "./js/feedback.js?v=2026-11-26.13",
        "./js/save.js": "./js/save.js?v=2026-11-26.13",
        "./js/shuffler.js": "./js/shuffler.js?v=2026-11-26.13",
        "./js/storage.js": "./js/storage.js?v=2026-11-26.13",
        "./js/swipe.js": "./js/swipe.js?v=2026-11-26.13",
        "./js/theme.js": "./js/theme.js?v=2026-11-26.13",
        "./js/timing.js": "./js/timing.js?v=2026-11-26.13"
      }
    }
  </script>
  <script type="module" src="js/app.js?v=2026-11-26.13"></script>
</head>
<body data-theme="neutral">
  <!-- One background layer per theme; css/styles.css fades between them -->
  <div class="theme-backdrop" data-theme="neutral" aria-hidden="true"></div>
  <div class="theme-backdrop" data-theme="icebreaker" aria-hidden="true"></div>
  <div class="theme-backdrop" data-theme="dating" aria-hidden="true"></div>
  <div class="theme-backdrop" data-theme="friends" aria-hidden="true"></div>
  <div class="theme-backdrop" data-theme="friends-party" aria-hidden="true"></div>
  <div class="theme-backdrop" data-theme="dating-adult" aria-hidden="true"></div>
  <div class="theme-backdrop" data-theme="friends-party-adult" aria-hidden="true"></div>

  <main id="app" class="app">
    <!-- Start screen: pick a section -->
    <section id="start-screen" class="screen start-screen" aria-labelledby="app-title" hidden>
      <div class="start-screen__intro">
        <h1 id="app-title" class="start-screen__title">Question Cards</h1>
        <p class="start-screen__subtitle">Ask each other anything. If it's awkward, blame the cards.</p>
      </div>
      <!-- js/app.js adds one button per section, from CONFIG.sections -->
      <div id="section-choices" class="section-choices"></div>
      <button id="reset-button" class="text-button" type="button">Reset seen cards</button>
    </section>

    <!-- Card screen: the card stack and its controls -->
    <section id="card-screen" class="screen" hidden>
      <header class="app-header">
        <button id="home-button" class="toggle-button" type="button">&larr; Home</button>
        <h2 id="section-title" class="app-header__title"></h2>
      </header>

      <div class="card-area">
        <!-- The row just above the card: the section's switches on the left,
             the level on the right. On narrow cards both shrink to chips
             (css/styles.css "Card toolbar"). -->
        <div class="card-toolbar">
          <!-- The section's gated switches (18+ in Dating; Party mode and 18+ wording
               in Friends & Teammates). js/app.js adds one per entry in the section's
               CONFIG toggles list, from the template below. Turning one on asks for
               Confirm first. -->
          <div id="toggle-setting" class="toggle-group" hidden></div>
          <template id="switch-template">
            <label class="switch">
              <input class="switch__input" type="checkbox" role="switch">
              <span class="switch__track" aria-hidden="true"></span>
              <span class="switch__label chip-text"></span>
              <span class="switch__label-short chip-short" aria-hidden="true"></span>
            </label>
          </template>

          <!-- Level: changes take effect on the next card -->
          <div class="level-controls">
            <button id="shallower-button" class="control-button control-button--small level-button" type="button">
              <span class="chip-icon" aria-hidden="true">&minus;</span><span class="chip-text">Go Shallower</span>
            </button>
            <div class="level-indicator" id="level-indicator" role="img">
              <!-- Three flowers, each reusing the #flower drawing at the end of the page.
                   Colours come from css/styles.css (fill, stroke and color). -->
              <span class="level-indicator__dots" aria-hidden="true">
                <svg class="level-dot" data-level="1" viewBox="0 0 24 24"><use href="#flower"></use></svg>
                <svg class="level-dot" data-level="2" viewBox="0 0 24 24"><use href="#flower"></use></svg>
                <svg class="level-dot" data-level="3" viewBox="0 0 24 24"><use href="#flower"></use></svg>
              </span>
              <span id="level-name" class="level-indicator__name" aria-hidden="true"></span>
            </div>
            <button id="deeper-button" class="control-button control-button--small level-button" type="button">
              <span class="chip-icon" aria-hidden="true">+</span><span class="chip-text">Go Deeper</span>
            </button>
          </div>
        </div>

        <!-- js/cards.js fills this with up to three cards -->
        <div id="card-stack" class="card-stack"></div>
      </div>
      <!-- Invisible: js/app.js puts each new question here so screen readers read it out -->
      <p id="card-announcer" class="visually-hidden" aria-live="polite"></p>

      <!-- Back, Save and Next. Back and Next are the same as the arrow keys;
           Save makes a picture of the card on top (js/card-image.js, js/save.js). -->
      <nav class="card-controls" aria-label="Card navigation">
        <button id="back-button" class="control-button" type="button">&larr; Back</button>
        <button id="save-button" class="control-button control-button--icon" type="button" aria-label="Save card" title="Save card">
          <svg class="save-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#floppy"></use></svg>
        </button>
        <button id="next-button" class="control-button control-button--primary" type="button">Next &rarr;</button>
      </nav>
      <!-- A short message after saving ("Card saved"); read out by screen readers -->
      <p id="toast" class="toast" role="status" hidden></p>
    </section>

    <!-- Confirmation dialog used by js/dialog.js (18+ check, Party mode rules, Reset).
         The heading is only shown when a dialog has one (Party mode rules). -->
    <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-dialog-message">
      <form method="dialog">
        <h2 id="confirm-dialog-heading" class="confirm-dialog__heading" hidden></h2>
        <p id="confirm-dialog-message" class="confirm-dialog__message"></p>
        <div class="confirm-dialog__buttons">
          <button id="confirm-dialog-cancel" class="control-button" type="submit" value="cancel">Cancel</button>
          <button id="confirm-dialog-confirm" class="control-button control-button--primary" type="submit" value="confirm">Confirm</button>
        </div>
      </form>
    </dialog>

    <!-- Saving fallback (js/save.js): the card picture full-screen, for
         browsers that can't save it directly -->
    <dialog id="save-preview" class="confirm-dialog save-preview" aria-labelledby="save-preview-message">
      <form method="dialog">
        <img id="save-preview-image" class="save-preview__image" alt="">
        <p id="save-preview-message" class="save-preview__message"></p>
        <div class="confirm-dialog__buttons">
          <button class="control-button control-button--primary" type="submit" value="close">Close</button>
        </div>
      </form>
    </dialog>

    <!-- Plain-language error message, hidden unless something fails to load -->
    <p id="error-message" class="error-message" role="alert" hidden></p>
  </main>

  <!-- Shared drawings, never shown on their own. The flower is five round
       petals with an ink centre; css/styles.css colours it per level. -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <symbol id="flower" viewBox="0 0 24 24">
      <path d="M9.53 8.60A3.9 3.9 0 1 1 14.47 8.60A3.9 3.9 0 1 1 15.99 13.30A3.9 3.9 0 1 1 12.00 16.20A3.9 3.9 0 1 1 8.01 13.30A3.9 3.9 0 1 1 9.53 8.60Z"></path>
      <circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"></circle>
    </symbol>
    <!-- The Save button's floppy disk, in the same ink style: an accent body
         with a cut corner, a metal shutter with its slot, and a paper label.
         css/styles.css .save-icon sets the colours. -->
    <symbol id="floppy" viewBox="0 0 24 24">
      <path class="save-icon__body" d="M4.5 3H17L21 7V19.5A1.5 1.5 0 0 1 19.5 21H4.5A1.5 1.5 0 0 1 3 19.5V4.5A1.5 1.5 0 0 1 4.5 3Z"></path>
      <rect class="save-icon__shutter" x="7" y="3" width="9" height="5.5"></rect>
      <rect class="save-icon__slot" x="12.5" y="4.25" width="2" height="3"></rect>
      <rect class="save-icon__label" x="6" y="12.5" width="12" height="8.5" rx="1"></rect>
    </symbol>
  </svg>
</body>
</html>
